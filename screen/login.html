<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConnectDesk - Login</title>

    <link rel="stylesheet" href="/css/login.css">
</head>
<body>

    <div class="container">

        <!-- Painel Login -->
        <div class="login-panel">
            <h1>Acesso</h1>

            <div class="caixa-login">
                <input type="email" id="email" placeholder="Email">
            </div>

            <div class="caixa-login">
                <input type="password" id="senha" placeholder="Senha">
            </div>

            <a href="#" class="esqueci-senha">Esqueci a senha</a>

            <button class="btn acessar" onclick="validarCampos()" href="/screen/usuario-perfil.html">
                Acessar
            </button>

            <p class="frase-cadastro">
            Não possui conta? <a href="/screen/cadastro.html" class="me-cadastrar">Me cadastrar</a>
            </p>
            
        </div>

    </div>

    <script src="/js/login.js"></script>
</body>
</html>
