<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConnectDesk - Login</title>

    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

    <div class="container">

        <!-- Painel Login -->
        <form id="form_login" class="login-panel">
            <h1>Acesso</h1>

            <div class="caixa-login">
                <input type="email" name="email" id="email" placeholder="Email">
            </div>

            <div class="caixa-login">
                <input type="password" name="senha" id="senha" placeholder="Senha">
            </div>

            <a href="#" class="esqueci-senha">Esqueci a senha</a>

            <button type="button" class="btn acessar" onclick="validarCampos(); login();">
                Acessar
            </button>

            <p class="frase-cadastro">
            Não possui conta? <a href="http://localhost/ConnectDesk/screen/cadastro.html" class="me-cadastrar">Me cadastrar</a>
            </p>
            
        </form>

    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/AJAX/login-ajax.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
